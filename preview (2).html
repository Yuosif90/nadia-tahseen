<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a1a;--card:#172626;--ink:#f1f6f4;--mute:#97b3b0;--line:#27403f}}
:root[data-theme="dark"]{--bg:#101a1a;--card:#172626;--ink:#f1f6f4;--mute:#97b3b0;--line:#27403f}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:"Noto Kufi Arabic",Tahoma,system-ui,sans-serif;line-height:1.7;min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:480px;margin:0 auto;padding:0 18px}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.lang{display:flex;gap:4px;width:max-content;margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px}
.lang button{border:0;background:none;color:var(--mute);font:inherit;font-size:13px;padding:4px 12px;border-radius:99px;cursor:pointer}
.lang button.on{background:var(--a);color:#fff}
.hero{text-align:center;padding:22px 0 4px}
.ring{position:relative;width:184px;height:184px;margin:0 auto}
.ring::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--a),var(--g2),var(--r),var(--a));animation:spin 9s linear infinite}
.ph{position:absolute;inset:6px;border-radius:50%;background:var(--bg);padding:4px}
.ph img,.ph .fb{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:center top;display:grid;place-items:center;background:var(--card)}
.fb svg{width:50%;fill:var(--a)}
.badge{position:absolute;inset-inline-end:8px;bottom:8px;width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--g),var(--g2));border:4px solid var(--bg);display:grid;place-items:center}
.badge svg{width:22px;fill:#fff}
.badge{animation:zoom 2.2s ease-in-out infinite}
@keyframes zoom{50%{transform:scale(1.2)}}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:23px;font-weight:800;margin-top:16px;line-height:1.5}
.role{color:var(--a);font-weight:600;font-size:15px}
.bio{color:var(--mute);font-size:14px;margin:8px auto 0;max-width:36ch}
.phones{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:14px}
.phones a{display:flex;align-items:center;gap:8px;direction:ltr;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 16px 5px 5px;font-weight:600;font-size:14px}
.phones i{width:32px;height:32px;border-radius:50%;background:var(--a);display:grid;place-items:center}
.phones svg{width:16px;fill:#fff}
.soc{display:grid;gap:10px;margin-top:22px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 6px 10px;font-size:13px;font-weight:600;transition:transform .2s}
.tile:hover{transform:translateY(-3px)}
.tile .c{width:50px;height:50px;border-radius:50%;display:grid;place-items:center}
.tile svg{width:26px;fill:#fff}
.tile .snap{fill:#fff;stroke:#111;stroke-width:1.4;stroke-linejoin:round;width:34px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.45));animation:float 2.8s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-4px)}}
.addr{position:relative;display:flex;align-items:center;gap:14px;margin-top:14px;padding:16px;border-radius:20px;border:1px solid var(--line);overflow:hidden;background:linear-gradient(var(--card),var(--card))}
.addr::before{content:"";position:absolute;inset:0;opacity:.5;background:repeating-linear-gradient(0deg,transparent 0 23px,var(--line) 23px 24px),repeating-linear-gradient(90deg,transparent 0 23px,var(--line) 23px 24px)}
.addr>*{position:relative}
.pin{position:relative;width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--g),var(--g2));display:grid;place-items:center;font-size:24px;flex:none}
.pin::after{content:"";position:absolute;inset:0;border-radius:14px;border:2px solid var(--g);animation:ping 2s ease-out infinite}
@keyframes ping{to{transform:scale(1.7);opacity:0}}
.addr small{color:var(--mute);font-size:12px;display:block}
.addr b{display:block;font-size:14px;line-height:1.6}
.addr em{font-style:normal;color:var(--a);font-size:12px;font-weight:600}
.addr .tx{flex:1}
.arr{width:20px;fill:none;stroke:var(--a);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
[dir=rtl] .arr{transform:scaleX(-1)}
h2{font-size:17px;margin:28px 0 12px}
.works{display:grid;gap:10px}
.wk{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-inline-start:4px solid var(--g);border-radius:16px;padding:12px 14px;transition:transform .2s}
.wk:hover{transform:translateY(-2px)}
.wk .ic{width:54px;height:54px;border-radius:15px;background:linear-gradient(135deg,var(--g),var(--g2));display:grid;place-items:center;font-size:27px;flex:none}
.wk b{display:block;font-size:15px}
.wk .ic svg{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wk span{font-size:12px;color:var(--mute)}
.wk>div{flex:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sv{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 12px 14px;text-align:center;transition:transform .2s}
.sv:hover{transform:translateY(-3px)}
.sv::before{content:"";position:absolute;top:-24px;left:50%;width:90px;height:90px;margin-left:-45px;border-radius:50%;background:var(--c);opacity:.18;filter:blur(18px)}
.sv .o{position:relative;width:58px;height:58px;margin:0 auto 8px;border-radius:50%;background:linear-gradient(135deg,var(--c),var(--c2));display:grid;place-items:center;font-size:27px}
.sv b{position:relative;display:block;font-size:14px}
.sv span{position:relative;display:block;font-size:12px;color:var(--mute);line-height:1.5}
.sv u{position:relative;display:block;width:26px;height:3px;border-radius:3px;background:var(--c);margin:8px auto 0}
.sl{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;scrollbar-width:none;border-radius:20px}
.sl::-webkit-scrollbar{display:none}
.sl>*{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:4/5;border-radius:20px;object-fit:cover;background:var(--card);border:1px solid var(--line);width:100%}
.sl .em{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--mute);font-size:13px;text-align:center;padding:20px;background:linear-gradient(135deg,var(--card),var(--line))}
.sl .em i{font-style:normal;font-size:44px}
.dots{display:flex;justify-content:center;gap:7px;margin-top:10px}
.dots button{width:8px;height:8px;border-radius:50%;border:0;padding:0;background:var(--line);cursor:pointer;transition:.2s}
.dots button.on{background:var(--a);width:22px;border-radius:8px}
.bar{position:fixed;inset-inline:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 40%);z-index:5}
.cta{display:flex;justify-content:center;align-items:center;gap:10px;max-width:480px;margin:0 auto;background:#1faa59;color:#fff;font-weight:800;border-radius:18px;padding:15px;box-shadow:0 8px 22px rgba(31,170,89,.35);animation:pulse 2.6s ease-in-out infinite}
.cta svg{width:22px;fill:#fff}
@keyframes pulse{50%{transform:scale(1.02)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

  $("name").textContent=t.name;$("role").textContent=t.role;$("bio").textContent=t.bio;document.title=t.name;
  $("phones").innerHTML=CONFIG.phones.map(n=>`<a href="tel:${n}"><i>${phoneI}</i>${n}</a>`).join("");
  const s=[["ig",CONFIG.instagram,t.ig],["wa",wa,t.wa]];if(CONFIG.snapchat)s.push(["sn",CONFIG.snapchat,t.sn]);
  $("soc").style.gridTemplateColumns="repeat("+s.length+",1fr)";
  $("soc").innerHTML=s.map(([k,u,l])=>`<a class="tile" href="${u}" target="_blank" rel="noopener"><span class="c" style="background:${IC[k][0]}">${IC[k][1]}</span>${l}</a>`).join("");
  $("addr").href=CONFIG.mapLink;
  $("addr").innerHTML=`<span class="pin">📍</span><span class="tx"><small>${t.addrH}</small><b>${t.addrT}</b><em>${t.addrGo}</em></span><svg class="arr" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>`;
  $("kT").textContent=t.kT;
  $("works").innerHTML=t.k.map(k=>`<a class="wk" href="${wa}?text=${encodeURIComponent(t.kMsg+k[1])}" target="_blank" rel="noopener"><span class="ic">${KI[k[0]]}</span><div><b>${k[1]}</b><span>${t.kSub}</span></div><svg class="arr" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></a>`).join("");
  $("sT").textContent=t.sT;
  $("svs").innerHTML=t.sv.map((v,i)=>`<div class="sv" style="--c:${COLORS[i%6][0]};--c2:${COLORS[i%6][1]}"><div class="o">${v[0]}</div><b>${v[1]}</b><span>${v[2]}</span><u></u></div>`).join("");
  $("gT").textContent=t.gT;gallery(t);
  $("cta").href=wa;$("ctaT").textContent=t.cta;
  $("lang").innerHTML=[["ku","کوردی"],["ar","عربي"],["en","EN"]].map(([c,l])=>`<button class="${c===lang?"on":""}" data-l="${c}">${l}</button>`).join("");
}
$("lang").addEventListener("click",e=>{const l=e.target.dataset.l;if(!l)return;lang=l;try{localStorage.setItem("lang",l)}catch(x){}render()});
$("sl").addEventListener("scroll",mark,{passive:true});
$("dots").addEventListener("click",e=>{const i=e.target.dataset.i;if(i==null)return;const s=$("sl"),d=document.documentElement.dir==="rtl"?-1:1;s.scrollTo({left:d*i*(s.clientWidth+10),behavior:"smooth"})});
photo();render();
</script>
</body>
</html>
